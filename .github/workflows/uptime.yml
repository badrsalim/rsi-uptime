# Checks rsi.badrbayan.com every five minutes. A failed run means three checks
# in a row failed; GitHub emails the account owner about failed runs.
name: Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: rsi.badrbayan.com answers
        run: |
          for attempt in 1 2 3; do
            body=$(curl -fsS --max-time 15 https://rsi.badrbayan.com/healthz) \
              && echo "$body" | grep -q '"ok":true' \
              && { echo "Up: $body"; exit 0; }
            echo "Attempt $attempt failed"
            sleep 20
          done
          echo "::error::rsi.badrbayan.com/healthz failed three times in a row"
          exit 1
